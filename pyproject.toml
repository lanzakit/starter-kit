[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lanzakit-tester"
version = "0.1.0"
description = "MCP server that generates and validates pytest tests using Claude."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Raquel Martinez" }]
keywords = ["mcp", "pytest", "testing", "ai", "claude", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "anthropic>=2.0.0",
    "python-dotenv>=1.0.0",
    "mcp[cli]>=2.0.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = ["black", "isort"]

[project.urls]
Homepage = "https://github.com/lanzakit/starter-kit"
Repository = "https://github.com/lanzakit/starter-kit"
Issues = "https://github.com/lanzakit/starter-kit/issues"

[project.scripts]
lanzakit-tester = "lanzakit_tester.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lanzakit_tester"]
